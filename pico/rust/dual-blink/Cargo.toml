[package]
name = "dual-link"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = "1.0.0"
static_cell = "2.1.1"


[profile.release]
debug = true
lto = true
opt-level = 's'

[[bin]]
name = "dual-link"
path = "src/main.rs"
test = false
doctest = false
bench = false
